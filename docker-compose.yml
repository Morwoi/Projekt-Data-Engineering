services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
      # Matches KAFKA_ADVERTISED_LISTENERS' PLAINTEXT_HOST://localhost:29092
      # below -- without publishing this port, a host-side Kafka client
      # (e.g. kafkacat, a GUI tool) would be handed an address by the
      # broker that it can't actually reach.
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - sensor-net

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      # Host port 27018, not the default 27017: on some machines a native
      # MongoDB install/service already owns 27017, and connections to
      # localhost:27017 would then silently reach that other database
      # instead of this project's container. Internal service-to-service
      # traffic (producer/consumer -> mongo:27017) is unaffected either way.
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - sensor-net

  producer:
    build: ./producer
    container_name: sensor-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: sensor-readings
      FETCH_INTERVAL_SECONDS: "10"
      # Overridable from the host shell (default: producer.py's own default
      # of 5s) so scripts/verify_citizen_failover.py can force every
      # Open-Meteo request to time out -- and the fallback simulator to take
      # over -- without touching real networking. See that script for why.
      API_TIMEOUT_SECONDS: "${API_TIMEOUT_SECONDS:-5}"
    restart: unless-stopped
    networks:
      - sensor-net

  consumer:
    build: ./consumer
    container_name: sensor-consumer
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: sensor-readings
      KAFKA_GROUP_ID: sensor-consumer-group
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: environment_monitoring
      MONGO_COLLECTION: sensor_readings
      # How long raw readings are kept before a TTL index expires them.
      # Planners work off daily/weekly aggregates (scripts/planner_queries.py),
      # not raw samples, so this bounds collection growth on a long-running
      # deployment instead of retaining every 10s sample forever.
      RAW_RETENTION_DAYS: "90"
      # Dead letters are kept longer than raw readings (a human needs to
      # act on them) but are still bounded via TTL -- see consumer.py.
      DEAD_LETTER_RETENTION_DAYS: "30"
    restart: unless-stopped
    networks:
      - sensor-net

volumes:
  kafka_data:
  mongo_data:

networks:
  sensor-net:
    driver: bridge
